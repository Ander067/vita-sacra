
name: vita_sacra_app
description: "Vita Sacra - Conocimiento medico al alcance de todos."

# Evitar la publicacion accidental del paquete.
publish_to: 'none'

# Version de la aplicacion.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencias del proyecto.
dependencies:
  flutter:
    sdk: flutter

  # Iconos de Cupertino.
  cupertino_icons: ^1.0.8

  # Comunicacion HTTP con FastAPI.
  http: ^1.6.0

  # Almacenamiento seguro de sesiones.
  flutter_secure_storage: ^11.2.0

  # Administracion del estado.
  provider: ^6.1.5+1

  # Visualizacion de modelos 3D.
  model_viewer_plus: ^1.10.0

  # Autenticacion biometrica.
  local_auth: ^2.3.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  

# Dependencias de desarrollo.
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generacion del icono de la aplicacion.
  flutter_launcher_icons: ^0.14.4

  # Reglas de buenas practicas para Dart.
  flutter_lints: ^6.0.0

# Configuracion de Flutter.
flutter:
  # Incluir los iconos de Material Design.
  uses-material-design: true

  # Recursos graficos de Vita Sacra.
  assets:
    - assets/images/icono.png
    - assets/images/vita_sacra_logo.png

# Configuracion del icono de la aplicacion.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icono.png"
  min_sdk_android: 21
